name: Claims

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

concurrency:
  group: claims-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  handle:
    # Only comments on issues (not PRs) that start a line with a command.
    if: >-
      !github.event.issue.pull_request &&
      contains(github.event.issue.labels.*.name, 'idea') &&
      contains(github.event.comment.body, '/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/handle-comment.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
