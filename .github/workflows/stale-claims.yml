name: Stale claims

on:
  schedule:
    - cron: "17 14 * * *" # daily, 14:17 UTC
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: stale-claims
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-stale.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
