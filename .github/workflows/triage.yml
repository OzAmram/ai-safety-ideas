name: Triage

on:
  issues:
    types: [opened, edited, labeled]
  workflow_dispatch: # re-check all open ideas

permissions:
  issues: write

concurrency:
  group: claims-${{ github.event.issue.number || 'all' }}
  cancel-in-progress: false

jobs:
  triage:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.labels.*.name, 'idea')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/triage.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
