name: Set up labels

# Run once after creating the repo (Actions tab -> "Set up labels" -> Run workflow).
on:
  workflow_dispatch:

permissions:
  issues: write

jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/setup-labels.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
